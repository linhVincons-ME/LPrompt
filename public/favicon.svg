<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lprompt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140926" />
      <stop offset="100%" stop-color="#1f0a33" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="lprompt-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>

    <!-- Main "L" Gradient (Hồng Tím - Purple/Fuchsia/Pink) -->
    <linearGradient id="lprompt-l-grad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Prompt Accent Gradient -->
    <linearGradient id="lprompt-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="lprompt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Core Glow Filter -->
    <filter id="lprompt-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle with subtle shadow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#lprompt-bg)" stroke="url(#lprompt-border)" stroke-width="2.5" />

  <!-- Ambient background glow behind the L -->
  <circle cx="56" cy="68" r="32" fill="#d946ef" opacity="0.18" filter="url(#lprompt-glow)" />

  <!-- Glowing Aura for the L shape -->
  <path d="M 43 24
           C 48 24 52 28 52 33
           L 52 68
           C 52 72 55 75 59 75
           L 89 75
           C 94 75 98 79 98 84
           C 98 89 94 93 89 93
           L 45 93
           C 38 93 33 88 33 81
           L 33 33
           C 33 28 37 24 43 24 Z"
        fill="url(#lprompt-l-grad)"
        opacity="0.35"
        filter="url(#lprompt-neon)" />

  <!-- Stylized Letter "L" -->
  <path d="M 43 24
           C 48 24 52 28 52 33
           L 52 68
           C 52 72 55 75 59 75
           L 89 75
           C 94 75 98 79 98 84
           C 98 89 94 93 89 93
           L 45 93
           C 38 93 33 88 33 81
           L 33 33
           C 33 28 37 24 43 24 Z"
        fill="url(#lprompt-l-grad)" />

  <!-- Highlight gloss on top-left of the L -->
  <path d="M 36 33
           C 36 29 39 26 43 26
           C 46 26 48 28 49 31
           L 49 68
           C 47 67 44 67 42 67
           L 36 67 Z"
        fill="#ffffff"
        opacity="0.28" />

  <!-- Prompt Cursor / Chevron '>' nested inside the L angle -->
  <path d="M 65 42
           L 78 53
           L 65 64"
        fill="none"
        stroke="url(#lprompt-accent-grad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#lprompt-neon)" />

  <!-- Sparkle Star (Gemini / AI intelligence) at top right -->
  <path d="M 96 26
           C 96 32 99 35 105 35
           C 99 35 96 38 96 44
           C 96 38 93 35 87 35
           C 93 35 96 32 96 26 Z"
        fill="#fbcfe8"
        filter="url(#lprompt-neon)" />

  <!-- Small accent sparkle dot -->
  <circle cx="72" cy="27" r="1.8" fill="#f472b6" opacity="0.85" />
</svg>